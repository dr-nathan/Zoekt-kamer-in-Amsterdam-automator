[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fb-housing-collector"
version = "0.1.0"
description = "Private Facebook housing-group collector and listing browser"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.118,<1",
    "jinja2>=3.1,<4",
    "openai>=2,<3",
    "playwright>=1.55,<2",
    "pydantic>=2,<3",
    "uvicorn>=0.37,<1",
]

[project.scripts]
fb-housing = "fb_automator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fb_automator = [
    "web_assets/templates/*.html",
    "web_assets/static/*.css",
    "web_assets/static/*.js",
]
